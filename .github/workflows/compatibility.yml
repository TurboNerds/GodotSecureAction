name: Compatibility Test

# Tests godot_secure.py against multiple Godot versions on all supported
# OS and cipher combinations. Runs weekly and can be triggered manually.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'   # every Sunday at midnight UTC

env:
  GODOT_REPO:           'godotengine/godot'
  GODOT_SECURE_REPO:    'emabrey/Godot-Secure'
  GODOT_SECURE_TAG:     'v1.0.2-alpha'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Build matrix: 3 versions × 3 ciphers × 3 OSes = 27 parallel jobs ────────

  build:
    name: ${{ matrix.godot-version }} / ${{ matrix.cipher }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        godot-version: ['master', '4.6-stable', '4.5-stable']
        os:            [ubuntu-latest, macos-latest, windows-latest]
        cipher:        [aes, camellia, aria]

    steps:

      # ── Python + SCons ───────────────────────────────────────────────────────

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      # ── Godot source cache (clean only) ──────────────────────────────────────

      - name: Restore Godot source cache
        id: cache-source
        uses: actions/cache/restore@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ matrix.godot-version }}

      - name: Download Godot source
        if: steps.cache-source.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p godot-source
          TAG_URL="https://github.com/${{ env.GODOT_REPO }}/archive/refs/tags/${{ matrix.godot-version }}.tar.gz"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$TAG_URL")
          if [ "$STATUS" = "200" ]; then
            DOWNLOAD_URL="$TAG_URL"
            echo "Resolved '${{ matrix.godot-version }}' as a release tag."
          else
            DOWNLOAD_URL="https://github.com/${{ env.GODOT_REPO }}/archive/refs/heads/${{ matrix.godot-version }}.tar.gz"
            echo "Resolved '${{ matrix.godot-version }}' as a branch."
          fi
          curl -fL "$DOWNLOAD_URL" | tar -xz --strip-components=1 -C godot-source
          echo "Downloaded Godot ${{ matrix.godot-version }} source."

      - name: Check if Godot source cache was saved by a concurrent job
        id: cache-source-check
        if: steps.cache-source.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ matrix.godot-version }}
          lookup-only: true

      - name: Save Godot source cache
        if: >-
          steps.cache-source.outputs.cache-hit != 'true' &&
          steps.cache-source-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ matrix.godot-version }}

      # ── SCons build cache ─────────────────────────────────────────────────────

      - name: Restore SCons cache
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: >-
            scons-${{ matrix.cipher }}-${{ runner.os }}-${{ matrix.godot-version }}-${{
            hashFiles('godot-source/version.py') }}
          restore-keys: |
            scons-${{ matrix.cipher }}-${{ runner.os }}-${{ matrix.godot-version }}-
            scons-${{ matrix.cipher }}-${{ runner.os }}-
            scons-${{ runner.os }}-${{ matrix.godot-version }}-
            scons-${{ runner.os }}-

      # ── Download godot_secure.py ──────────────────────────────────────────────

      - name: Download godot_secure.py
        shell: bash
        run: |
          curl -fL \
            "https://github.com/${{ env.GODOT_SECURE_REPO }}/releases/download/${{ env.GODOT_SECURE_TAG }}/godot_secure.py" \
            -o godot_secure.py

      # ── Apply Godot Secure patch ──────────────────────────────────────────────

      - name: Apply Godot Secure (${{ matrix.cipher }})
        shell: bash
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_ENCRYPTION_KEY }}
        run: |
          python godot_secure.py godot-source \
            --mode apply \
            --algorithm ${{ matrix.cipher }} \
            --advanced-kdf \
            --non-interactive

      - name: Upload Godot Secure log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.godot-version }}-${{ matrix.cipher }}-${{ runner.os }}
          path: godot_secure_*.log
          if-no-files-found: warn

      # ── System dependencies ───────────────────────────────────────────────────

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev libxrender-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev libfreetype-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libdecor-0-dev pkg-config yasm

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install molten-vk yasm

      # ── Windows: install D3D12 SDK ────────────────────────────────────────────

      - name: Install D3D12 SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: godot-source
        run: python misc/scripts/install_d3d12_sdk_windows.py

      # ── Detect platform ───────────────────────────────────────────────────────

      - name: Detect platform
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              echo "value=linuxbsd" >> "$GITHUB_OUTPUT"
              echo "extra-args=lto=full" >> "$GITHUB_OUTPUT"
              ;;
            macOS)
              VULKAN_PATH="$(brew --prefix molten-vk)"
              echo "value=macos" >> "$GITHUB_OUTPUT"
              echo "extra-args=vulkan_sdk_path=${VULKAN_PATH} lto=full" >> "$GITHUB_OUTPUT"
              ;;
            Windows)
              echo "value=windows" >> "$GITHUB_OUTPUT"
              echo "extra-args=d3d12=yes lto=full" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ── Build ─────────────────────────────────────────────────────────────────

      - name: Build editor
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=editor \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      - name: Build export template (debug)
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=template_debug \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      - name: Build export template (release)
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=template_release \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      # ── Upload artifacts ──────────────────────────────────────────────────────

      - name: Upload editor
        uses: actions/upload-artifact@v7
        with:
          name: editor-${{ matrix.godot-version }}-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*editor*
          if-no-files-found: error

      - name: Upload debug template
        uses: actions/upload-artifact@v7
        with:
          name: template-debug-${{ matrix.godot-version }}-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*template_debug*
          if-no-files-found: error

      - name: Upload release template
        uses: actions/upload-artifact@v7
        with:
          name: template-release-${{ matrix.godot-version }}-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*template_release*
          if-no-files-found: error

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.godot-version }}-${{ matrix.cipher }}-${{ runner.os }}
          path: |
            godot-source/bin/*editor*
            godot-source/bin/*template_debug*
            godot-source/bin/*template_release*
          if-no-files-found: error

  # ── Final packaging: one artifact per version+cipher containing all three OSes
  # Same layout as the main build workflow, but scoped per Godot version so that
  # artifacts from different compatibility runs are kept separate.
  # Artifact layout:
  #   godot-secure-{version}-{cipher}/
  #     linux/   — editor + template_debug + template_release
  #     macos/   — editor + template_debug + template_release
  #     windows/ — editor + template_debug + template_release

  package:
    name: Package / ${{ matrix.godot-version }} / ${{ matrix.cipher }}
    needs: [build, integration-test]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        godot-version: ['master', '4.6-stable', '4.5-stable']
        cipher:        [aes, camellia, aria]

    steps:
      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.godot-version }}-${{ matrix.cipher }}-Linux
          path: release/linux/

      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.godot-version }}-${{ matrix.cipher }}-macOS
          path: release/macos/

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.godot-version }}-${{ matrix.cipher }}-Windows
          path: release/windows/

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: godot-secure-${{ matrix.godot-version }}-${{ matrix.cipher }}
          path: release/
          if-no-files-found: error

  # ── Integration tests: one job per Godot version (Linux, AES) ────────────────
  # Runs the same four tests as the main build workflow. The template directory
  # name is derived by fetching version.py from GitHub for the specific ref so
  # that it works correctly for both tagged releases and the master branch.

  integration-test:
    name: Integration test / ${{ matrix.godot-version }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        godot-version: ['master', '4.6-stable', '4.5-stable']

    env:
      TEST_SECRET: "gs_secret_tk9v2x8m4p7n1q3r5w"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AES Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.godot-version }}-aes-Linux
          path: godot-bundle/

      - name: Make binaries executable
        run: chmod +x godot-bundle/*

      - name: Locate editor binary
        id: editor
        run: |
          BIN=$(find godot-bundle -type f -executable -name "*editor*" | head -1)
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Found editor: $BIN"

      # ── Test 1: smoke test ────────────────────────────────────────────────────

      - name: Smoke test — version string
        run: |
          VERSION=$("${{ steps.editor.outputs.path }}" --headless --version 2>&1 || true)
          echo "Version output: $VERSION"
          if echo "$VERSION" | grep -q "With Godot Secure"; then
            echo "✓  PASS — version string contains '(With Godot Secure)'"
          else
            echo "✗  FAIL — version string does not contain '(With Godot Secure)'"
            exit 1
          fi

      # ── Derive template directory from version.py ─────────────────────────────
      # Fetches version.py directly from GitHub for the specific ref so the
      # template directory name is always correct — including for the master
      # branch where the version cannot be inferred from the ref string alone.

      - name: Resolve Godot template directory version
        id: tmpl-version
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ env.GODOT_REPO }}/${{ matrix.godot-version }}/version.py" \
            -o /tmp/godot_version.py

          TMPL_VERSION=$(python3 - <<'EOF'
          d = {}
          exec(open("/tmp/godot_version.py").read(), d)
          major  = d["major"]
          minor  = d["minor"]
          patch  = d.get("patch", 0)
          status = d["status"]
          print(f"{major}.{minor}.{status}" if patch == 0 else f"{major}.{minor}.{patch}.{status}")
          EOF
          )

          echo "value=$TMPL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Template directory version: $TMPL_VERSION"

      # ── Test 2: headless export ───────────────────────────────────────────────

      - name: Install export templates
        run: |
          TMPL_DIR="$HOME/.local/share/godot/export_templates/${{ steps.tmpl-version.outputs.value }}"
          mkdir -p "$TMPL_DIR"
          DEBUG=$(find godot-bundle -type f -executable -name "*template_debug*" | head -1)
          RELEASE=$(find godot-bundle -type f -executable -name "*template_release*" | head -1)
          cp "$DEBUG"   "$TMPL_DIR/linux_debug.x86_64"
          cp "$RELEASE" "$TMPL_DIR/linux_release.x86_64"
          chmod +x "$TMPL_DIR"/*.x86_64
          echo "Installed to: $TMPL_DIR"
          ls -lh "$TMPL_DIR/"

      - name: Export test project
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_ENCRYPTION_KEY }}
        run: |
          mkdir -p test/project/exported
          "${{ steps.editor.outputs.path }}" \
            --headless \
            --path test/project \
            --export-release "Linux" \
            exported/test.pck
          ls -lh test/project/exported/

      # ── Test 3: magic header ──────────────────────────────────────────────────

      - name: Verify PCK magic header is not default Godot magic
        run: python3 test/scripts/check_magic_header.py test/project/exported/test.pck

      # ── Download gdsdecomp ────────────────────────────────────────────────────

      - name: Download gdsdecomp
        run: |
          ASSET_URL=$(curl -fsSL https://api.github.com/repos/bruvzg/gdsdecomp/releases/latest \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data['assets']:
              name = a['name'].lower()
              if ('linux' in name or 'lin' in name) and ('x86_64' in name or 'amd64' in name) and name.endswith('.zip'):
                  print(a['browser_download_url'])
                  break
          ")
          echo "Downloading gdsdecomp from: $ASSET_URL"
          curl -fL "$ASSET_URL" -o gdsdecomp.zip
          unzip -q gdsdecomp.zip -d gdsdecomp/
          find gdsdecomp/ -type f | xargs chmod +x 2>/dev/null || true

      # ── Test 4: reverse engineering resistance ────────────────────────────────

      - name: Reverse engineering resistance test
        run: |
          python3 test/scripts/test_reverse_engineering.py \
            --pck    test/project/exported/test.pck \
            --tool   gdsdecomp/ \
            --secret "${{ env.TEST_SECRET }}"
