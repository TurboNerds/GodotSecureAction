name: Build Godot Secure

on:
  workflow_dispatch:
  push:
    branches: [main]

# One encryption key is shared across all cipher/OS combinations so that a
# single exported project works with every platform binary.
# Required: store your 64-character hex AES key as an encrypted Actions
# secret named GODOT_ENCRYPTION_KEY.

env:
  GODOT_VERSION:                    '4.6-stable'
  GODOT_REPO:                       'godotengine/godot'
  GODOT_SECURE_REPO:                'emabrey/Godot-Secure'
  GODOT_SECURE_TAG:                 'v1.0.2-alpha'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Build matrix: 3 ciphers × 3 OSes = 9 parallel jobs ─────────────────────
  # GitHub Actions caches are OS-scoped, so the Godot source is cached and
  # downloaded independently on each runner OS. Each job handles its own
  # cache restore/save rather than sharing through a prepare job.

  build:
    name: ${{ matrix.cipher }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:     [ubuntu-latest, macos-latest, windows-latest]
        cipher: [aes, camellia, aria]

    steps:

      # ── Python + SCons ───────────────────────────────────────────────────────

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      # ── Godot source cache (clean only) ──────────────────────────────────────
      # Cache key is version-only — the source tarball is identical across all
      # operating systems. GitHub Actions handles OS-scoping transparently, so
      # there is no need to embed runner.os in the key.
      #
      # actions/cache/restore is used instead of actions/cache so the cache is
      # never saved at job end. Each job patches the source tree with a
      # different cipher; saving after patching would pollute the cache with
      # cipher-specific modifications. The clean source is saved explicitly
      # with actions/cache/save immediately after download, before any patching.

      - name: Restore Godot source cache
        id: cache-source
        uses: actions/cache/restore@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ env.GODOT_VERSION }}

      - name: Download Godot source
        if: steps.cache-source.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p godot-source
          curl -fL \
            "https://github.com/${{ env.GODOT_REPO }}/archive/refs/tags/${{ env.GODOT_VERSION }}.tar.gz" \
            | tar -xz --strip-components=1 -C godot-source
          echo "Downloaded Godot ${{ env.GODOT_VERSION }} source."

      - name: Check if Godot source cache was saved by a concurrent job
        id: cache-source-check
        if: steps.cache-source.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ env.GODOT_VERSION }}
          lookup-only: true

      - name: Save Godot source cache
        if: >-
          steps.cache-source.outputs.cache-hit != 'true' &&
          steps.cache-source-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ env.GODOT_VERSION }}

      # ── SCons build cache ────────────────────────────────────────────────────
      # Keyed per cipher + OS so caches from different combinations never mix.

      - name: Restore SCons cache
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: >-
            scons-${{ matrix.cipher }}-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{
            hashFiles('godot-source/version.py') }}
          restore-keys: |
            scons-${{ matrix.cipher }}-${{ runner.os }}-${{ env.GODOT_VERSION }}-
            scons-${{ matrix.cipher }}-${{ runner.os }}-

      # ── Download godot_secure.py ─────────────────────────────────────────────

      - name: Download godot_secure.py
        shell: bash
        run: |
          curl -fL \
            "https://github.com/${{ env.GODOT_SECURE_REPO }}/releases/download/${{ env.GODOT_SECURE_TAG }}/godot_secure.py" \
            -o godot_secure.py
          echo "Downloaded godot_secure.py from ${{ env.GODOT_SECURE_REPO }}@${{ env.GODOT_SECURE_TAG }}."

      # ── Apply Godot Secure patch ─────────────────────────────────────────────

      - name: Apply Godot Secure (${{ matrix.cipher }})
        shell: bash
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_ENCRYPTION_KEY }}
        run: |
          python godot_secure.py godot-source \
            --mode apply \
            --algorithm ${{ matrix.cipher }} \
            --advanced-kdf \
            --non-interactive

      - name: Upload Godot Secure log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-secure-log-${{ matrix.cipher }}-${{ runner.os }}
          path: godot_secure_*.log
          if-no-files-found: warn

      # ── System dependencies ──────────────────────────────────────────────────

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxext-dev \
            libxrender-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdbus-1-dev \
            libfreetype-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdecor-0-dev \
            pkg-config \
            yasm

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk yasm

      # ── Windows: install D3D12 SDK dependencies ──────────────────────────────
      # Godot ships a helper script that downloads the D3D12 Agility SDK, DXC
      # shader compiler, and PIX runtime via NuGet. It must run before SCons.

      - name: Install D3D12 SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: godot-source
        run: python misc/scripts/install_d3d12_sdk_windows.py

      # ── Detect platform and resolve platform-specific SCons args ─────────────

      - name: Detect platform
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              echo "value=linuxbsd" >> "$GITHUB_OUTPUT"
              echo "extra-args=lto=full" >> "$GITHUB_OUTPUT"
              ;;
            macOS)
              # MoltenVK is installed by brew into its own prefix-relative opt dir.
              VULKAN_PATH="$(brew --prefix molten-vk)"
              echo "value=macos" >> "$GITHUB_OUTPUT"
              echo "extra-args=vulkan_sdk_path=${VULKAN_PATH} lto=full" >> "$GITHUB_OUTPUT"
              ;;
            Windows)
              # d3d12=yes causes Godot's SCons scripts to download the D3D12
              # Agility SDK and DXC shader compiler via NuGet automatically.
              # NuGet is pre-installed on GitHub-hosted Windows runners.
              echo "value=windows" >> "$GITHUB_OUTPUT"
              echo "extra-args=d3d12=yes lto=full" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Build editor
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=editor \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      - name: Build export template (debug)
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=template_debug \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      - name: Build export template (release)
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=template_release \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      # ── Upload artifacts ─────────────────────────────────────────────────────
      # Each build output is uploaded as a separate artifact so individual
      # files can be downloaded without fetching the entire bin/ directory.

      - name: Upload editor
        uses: actions/upload-artifact@v7
        with:
          name: godot-editor-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*editor*
          if-no-files-found: error

      - name: Upload debug template
        uses: actions/upload-artifact@v7
        with:
          name: godot-template-debug-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*template_debug*
          if-no-files-found: error

      - name: Upload release template
        uses: actions/upload-artifact@v7
        with:
          name: godot-template-release-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*template_release*
          if-no-files-found: error
