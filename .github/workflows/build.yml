name: Build Godot Secure

on:
  workflow_dispatch:
  push:
    branches: [main]

# One encryption key is shared across all cipher/OS combinations so that a
# single exported project works with every platform binary.
# Required: store your 64-character hex AES key as an encrypted Actions
# secret named GODOT_ENCRYPTION_KEY.

env:
  GODOT_VERSION:                    '4.6-stable'
  GODOT_REPO:                       'godotengine/godot'
  GODOT_SECURE_REPO:                'emabrey/Godot-Secure'
  GODOT_SECURE_TAG:                 'v1.0.2-alpha'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Build matrix: 3 ciphers × 3 OSes = 9 parallel jobs ─────────────────────
  # GitHub Actions caches are OS-scoped, so the Godot source is cached and
  # downloaded independently on each runner OS. Each job handles its own
  # cache restore/save rather than sharing through a prepare job.

  build:
    name: ${{ matrix.cipher }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:     [ubuntu-latest, macos-latest, windows-latest]
        cipher: [aes, camellia, aria]

    steps:

      # ── Python + SCons ───────────────────────────────────────────────────────

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      # ── Godot source cache (clean only) ──────────────────────────────────────
      # Cache key is version-only — the source tarball is identical across all
      # operating systems. GitHub Actions handles OS-scoping transparently, so
      # there is no need to embed runner.os in the key.
      #
      # actions/cache/restore is used instead of actions/cache so the cache is
      # never saved at job end. Each job patches the source tree with a
      # different cipher; saving after patching would pollute the cache with
      # cipher-specific modifications. The clean source is saved explicitly
      # with actions/cache/save immediately after download, before any patching.

      - name: Restore Godot source cache
        id: cache-source
        uses: actions/cache/restore@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ env.GODOT_VERSION }}

      - name: Download Godot source
        if: steps.cache-source.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p godot-source
          curl -fL \
            "https://github.com/${{ env.GODOT_REPO }}/archive/refs/tags/${{ env.GODOT_VERSION }}.tar.gz" \
            | tar -xz --strip-components=1 -C godot-source
          echo "Downloaded Godot ${{ env.GODOT_VERSION }} source."

      - name: Check if Godot source cache was saved by a concurrent job
        id: cache-source-check
        if: steps.cache-source.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ env.GODOT_VERSION }}
          lookup-only: true

      - name: Save Godot source cache
        if: >-
          steps.cache-source.outputs.cache-hit != 'true' &&
          steps.cache-source-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: godot-source
          key: godot-source-${{ env.GODOT_REPO }}-${{ env.GODOT_VERSION }}

      # ── SCons build cache ────────────────────────────────────────────────────
      # SCons CacheDir is content-addressed: each compiled object is stored
      # under a hash of (source content + compiler flags + all dependencies).
      # Unpatched files produce the same hash every run and are restored from
      # cache without recompilation. Only the files Godot Secure modifies —
      # and anything that transitively includes their changed headers — will
      # miss and be recompiled.
      #
      # Save key    : scons-{cipher}-{os}-{version}-{hash}  (exact match)
      # Restore keys: fall back first to the same cipher (different hash, e.g.
      #               after a Godot version bump), then to any other cipher for
      #               the same OS and version. The cross-cipher fallback lets a
      #               Camellia job seed from an AES cache and skip recompiling
      #               the ~99% of object files that are identical across ciphers.

      - name: Restore SCons cache
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: >-
            scons-${{ matrix.cipher }}-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{
            hashFiles('godot-source/version.py') }}
          restore-keys: |
            scons-${{ matrix.cipher }}-${{ runner.os }}-${{ env.GODOT_VERSION }}-
            scons-${{ matrix.cipher }}-${{ runner.os }}-
            scons-${{ runner.os }}-${{ env.GODOT_VERSION }}-
            scons-${{ runner.os }}-

      # ── Download godot_secure.py ─────────────────────────────────────────────

      - name: Download godot_secure.py
        shell: bash
        run: |
          curl -fL \
            "https://github.com/${{ env.GODOT_SECURE_REPO }}/releases/download/${{ env.GODOT_SECURE_TAG }}/godot_secure.py" \
            -o godot_secure.py
          echo "Downloaded godot_secure.py from ${{ env.GODOT_SECURE_REPO }}@${{ env.GODOT_SECURE_TAG }}."

      # ── Apply Godot Secure patch ─────────────────────────────────────────────

      - name: Apply Godot Secure (${{ matrix.cipher }})
        shell: bash
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_ENCRYPTION_KEY }}
        run: |
          python godot_secure.py godot-source \
            --mode apply \
            --algorithm ${{ matrix.cipher }} \
            --advanced-kdf \
            --non-interactive

      - name: Upload Godot Secure log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-secure-log-${{ matrix.cipher }}-${{ runner.os }}
          path: godot_secure_*.log
          if-no-files-found: warn

      # ── System dependencies ──────────────────────────────────────────────────

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxext-dev \
            libxrender-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdbus-1-dev \
            libfreetype-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdecor-0-dev \
            pkg-config \
            yasm

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk yasm

      # ── Windows: install D3D12 SDK dependencies ──────────────────────────────
      # Godot ships a helper script that downloads the D3D12 Agility SDK, DXC
      # shader compiler, and PIX runtime via NuGet. It must run before SCons.

      - name: Install D3D12 SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: godot-source
        run: python misc/scripts/install_d3d12_sdk_windows.py

      # ── Detect platform and resolve platform-specific SCons args ─────────────

      - name: Detect platform
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              echo "value=linuxbsd" >> "$GITHUB_OUTPUT"
              echo "extra-args=lto=full" >> "$GITHUB_OUTPUT"
              ;;
            macOS)
              # MoltenVK is installed by brew into its own prefix-relative opt dir.
              VULKAN_PATH="$(brew --prefix molten-vk)"
              echo "value=macos" >> "$GITHUB_OUTPUT"
              echo "extra-args=vulkan_sdk_path=${VULKAN_PATH} lto=full" >> "$GITHUB_OUTPUT"
              ;;
            Windows)
              # d3d12=yes causes Godot's SCons scripts to download the D3D12
              # Agility SDK and DXC shader compiler via NuGet automatically.
              # NuGet is pre-installed on GitHub-hosted Windows runners.
              echo "value=windows" >> "$GITHUB_OUTPUT"
              echo "extra-args=d3d12=yes lto=full" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Build editor
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=editor \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      - name: Build export template (debug)
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=template_debug \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      - name: Build export template (release)
        shell: bash
        working-directory: godot-source
        run: |
          scons \
            platform=${{ steps.platform.outputs.value }} \
            target=template_release \
            ${{ steps.platform.outputs.extra-args }} \
            cache_path=../.scons-cache \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      # ── Upload artifacts ─────────────────────────────────────────────────────
      # Each build output is uploaded as a separate artifact so individual
      # files can be downloaded without fetching the entire bin/ directory.

      - name: Upload editor
        uses: actions/upload-artifact@v7
        with:
          name: godot-editor-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*editor*
          if-no-files-found: error

      - name: Upload debug template
        uses: actions/upload-artifact@v7
        with:
          name: godot-template-debug-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*template_debug*
          if-no-files-found: error

      - name: Upload release template
        uses: actions/upload-artifact@v7
        with:
          name: godot-template-release-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/*template_release*
          if-no-files-found: error

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: godot-bundle-${{ matrix.cipher }}-${{ runner.os }}
          path: |
            godot-source/bin/*editor*
            godot-source/bin/*template_debug*
            godot-source/bin/*template_release*
          if-no-files-found: error

  # ── Integration tests ────────────────────────────────────────────────────────
  # Runs on Linux using the AES bundle. Tests:
  #   1. Smoke test   — editor reports patched version string
  #   2. Export test  — test project exports successfully under headless mode
  #   3. Magic header — exported PCK does not carry the default Godot magic
  #   4. Anti-RE test — gdsdecomp cannot recover the embedded canary secret

  integration-test:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest

    env:
      # Canary string embedded in test/project/main.gd.
      # Must match the value of INTEGRATION_TEST_SECRET in that file.
      TEST_SECRET: "gs_secret_tk9v2x8m4p7n1q3r5w"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AES Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: godot-bundle-aes-Linux
          path: godot-bundle/

      - name: Make binaries executable
        run: chmod +x godot-bundle/*

      - name: Locate editor binary
        id: editor
        run: |
          BIN=$(find godot-bundle -type f -executable -name "*editor*" | head -1)
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Found editor: $BIN"

      # ── Test 1: smoke test ─────────────────────────────────────────────────

      - name: Smoke test — version string
        run: |
          VERSION=$("${{ steps.editor.outputs.path }}" --headless --version 2>&1 || true)
          echo "Version output: $VERSION"
          if echo "$VERSION" | grep -q "With Godot Secure"; then
            echo "✓  PASS — version string contains '(With Godot Secure)'"
          else
            echo "✗  FAIL — version string does not contain '(With Godot Secure)'"
            echo "   Full output: $VERSION"
            exit 1
          fi

      # ── Install export templates ───────────────────────────────────────────

      - name: Install export templates
        run: |
          # Godot's template directory uses dots instead of dashes in the
          # version string (e.g. 4.6-stable → 4.6.stable, 4.5.1-rc1 → 4.5.1.rc1).
          TMPL_VERSION=$(echo "${{ env.GODOT_VERSION }}" | tr '-' '.')
          TMPL_DIR="$HOME/.local/share/godot/export_templates/$TMPL_VERSION"
          mkdir -p "$TMPL_DIR"

          DEBUG=$(find godot-bundle -type f -executable -name "*template_debug*" | head -1)
          RELEASE=$(find godot-bundle -type f -executable -name "*template_release*" | head -1)

          cp "$DEBUG"   "$TMPL_DIR/linux_debug.x86_64"
          cp "$RELEASE" "$TMPL_DIR/linux_release.x86_64"
          chmod +x "$TMPL_DIR"/*.x86_64

          echo "Installed templates:"
          ls -lh "$TMPL_DIR/"

      # ── Test 2: headless export ────────────────────────────────────────────

      - name: Export test project
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_ENCRYPTION_KEY }}
        run: |
          mkdir -p test/project/exported
          "${{ steps.editor.outputs.path }}" \
            --headless \
            --path test/project \
            --export-release "Linux" \
            exported/test.pck
          ls -lh test/project/exported/

      # ── Test 3: magic header check ─────────────────────────────────────────

      - name: Verify PCK magic header is not default Godot magic
        run: python3 test/scripts/check_magic_header.py test/project/exported/test.pck

      # ── Download gdsdecomp ─────────────────────────────────────────────────

      - name: Download gdsdecomp
        run: |
          ASSET_URL=$(curl -fsSL https://api.github.com/repos/bruvzg/gdsdecomp/releases/latest \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data['assets']:
              name = a['name'].lower()
              if ('linux' in name or 'lin' in name) and ('x86_64' in name or 'amd64' in name) and name.endswith('.zip'):
                  print(a['browser_download_url'])
                  break
          ")
          echo "Downloading gdsdecomp from: $ASSET_URL"
          curl -fL "$ASSET_URL" -o gdsdecomp.zip
          unzip -q gdsdecomp.zip -d gdsdecomp/
          find gdsdecomp/ -type f | xargs chmod +x 2>/dev/null || true
          echo "gdsdecomp contents:"
          find gdsdecomp/ -type f

      # ── Test 4: reverse engineering resistance ─────────────────────────────

      - name: Reverse engineering resistance test
        run: |
          python3 test/scripts/test_reverse_engineering.py \
            --pck    test/project/exported/test.pck \
            --tool   gdsdecomp/ \
            --secret "${{ env.TEST_SECRET }}"
