name: Build Godot Secure

# CI workflow — runs on every push to main to verify that GodotSecureAction
# works correctly across all cipher and OS combinations.
#
# This workflow exercises the action itself. For the production release
# workflow that produces distributable artifacts, see release.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION:      '4.6-stable'
  GODOT_REPO:         'godotengine/godot'
  GODOT_SECURE_REPO:  'emabrey/Godot-Secure'
  GODOT_SECURE_TAG:   'v1.1.0-alpha'

jobs:

  # ── Setup: generate shared security parameters ────────────────────────────────
  # All 9 build jobs must embed identical magic headers, security token, and KDF
  # formula or cross-platform PCK files will fail to open (wrong magic) or
  # decrypt to garbage (wrong token/formula). Generate all four values once here
  # and pass them to every build job via needs outputs.

  setup:
    name: Generate shared security parameters
    runs-on: ubuntu-latest

    outputs:
      base-tag:       ${{ steps.gen.outputs.base-tag }}
      enc-tag:        ${{ steps.gen.outputs.enc-tag }}
      security-token: ${{ steps.gen.outputs.security-token }}
      kdf-formula:    ${{ steps.gen.outputs.kdf-formula }}

    steps:
      - name: Download Godot Secure script
        run: |
          curl -fL \
            "https://github.com/${{ env.GODOT_SECURE_REPO }}/releases/download/${{ env.GODOT_SECURE_TAG }}/godot_secure.py" \
            -o godot_secure.py

      - name: Generate security parameters
        id: gen
        run: python3 godot_secure.py --mode generate --advanced-kdf --non-interactive

  # ── Build matrix: 3 ciphers × 3 OSes = 9 parallel jobs ──────────────────────

  build:
    name: ${{ matrix.cipher }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [setup]

    strategy:
      fail-fast: false
      matrix:
        os:     [ubuntu-latest, macos-latest, windows-latest]
        cipher: [aes, camellia, aria]

    steps:
      - name: Build Godot Secure (${{ matrix.cipher }})
        id: godot-secure
        uses: emabrey/GodotSecureAction@v1
        with:
          godot-version:     ${{ env.GODOT_VERSION }}
          godot-repo:        ${{ env.GODOT_REPO }}
          godot-secure-repo: ${{ env.GODOT_SECURE_REPO }}
          godot-secure-tag:  ${{ env.GODOT_SECURE_TAG }}
          algorithm:         ${{ matrix.cipher }}
          encryption-key:    ${{ secrets.GODOT_ENCRYPTION_KEY }}
          base-tag:          ${{ needs.setup.outputs.base-tag }}
          enc-tag:           ${{ needs.setup.outputs.enc-tag }}
          security-token:    ${{ needs.setup.outputs.security-token }}
          kdf-formula:       ${{ needs.setup.outputs.kdf-formula }}
          target:            all
          scons-cache:       true

      - name: Upload Godot Secure log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-${{ matrix.cipher }}-${{ runner.os }}
          path: godot_secure_*.log
          if-no-files-found: warn

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: godot-secure-${{ matrix.cipher }}-${{ runner.os }}
          path: godot-source/bin/godot.*
          if-no-files-found: error

  # ── Integration tests ─────────────────────────────────────────────────────────
  # Runs on Linux using the AES bundle. Tests:
  #   1. Smoke test   — startup banner contains "(With Godot Secure)"
  #   2. Export test  — test project exports successfully under headless mode
  #   3. Magic header — exported PCK does not carry the default Godot magic
  #   4. Anti-RE test — gdsdecomp cannot recover the embedded canary secret

  integration-test:
    name: Integration tests
    needs: [setup, build]
    runs-on: ubuntu-latest

    env:
      TEST_SECRET: "gs_secret_tk9v2x8m4p7n1q3r5w"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download AES Linux bundle
        uses: actions/download-artifact@v6
        with:
          name: godot-secure-aes-Linux
          path: godot-bundle/

      - name: Make binaries executable
        run: chmod +x godot-bundle/*

      - name: Locate editor binary
        id: editor
        run: |
          BIN=$(find godot-bundle -type f -executable -name "*editor*" | head -1)
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Found editor: $BIN"

      # ── Test 1: smoke test ─────────────────────────────────────────────────
      # Godot Secure patches version.py's `name` field, which appears in the
      # startup banner ("Godot Engine (With Godot Secure) v4.6.stable...").
      # --version only outputs the semver number; use --headless --quit to
      # capture the full startup output that contains the engine name instead.

      - name: Smoke test — startup banner contains "(With Godot Secure)"
        run: |
          BANNER=$("${{ steps.editor.outputs.path }}" --headless --quit 2>&1 || true)
          echo "Startup output:"
          echo "$BANNER"
          if echo "$BANNER" | grep -q "With Godot Secure"; then
            echo "✓  PASS — startup banner contains '(With Godot Secure)'"
          else
            echo "✗  FAIL — startup banner does not contain '(With Godot Secure)'"
            exit 1
          fi

      # ── Install export templates ───────────────────────────────────────────

      - name: Install export templates
        run: |
          TMPL_VERSION=$(echo "${{ env.GODOT_VERSION }}" | tr '-' '.')
          TMPL_DIR="$HOME/.local/share/godot/export_templates/$TMPL_VERSION"
          mkdir -p "$TMPL_DIR"

          DEBUG=$(find godot-bundle -type f -executable -name "*template_debug*"   | head -1)
          RELEASE=$(find godot-bundle -type f -executable -name "*template_release*" | head -1)

          cp "$DEBUG"   "$TMPL_DIR/linux_debug.x86_64"
          cp "$RELEASE" "$TMPL_DIR/linux_release.x86_64"
          chmod +x "$TMPL_DIR"/*.x86_64

          echo "Installed templates:"
          ls -lh "$TMPL_DIR/"

      # ── Test 2: headless export ────────────────────────────────────────────

      - name: Export test project
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_ENCRYPTION_KEY }}
        run: |
          mkdir -p test/project/exported
          "${{ steps.editor.outputs.path }}" \
            --headless \
            --path test/project \
            --export-release "Linux" \
            exported/test.pck
          ls -lh test/project/exported/

      # ── Test 3: magic header check ─────────────────────────────────────────

      - name: Verify PCK magic header matches expected base-tag
        run: python3 test/scripts/check_magic_header.py test/project/exported/test.pck "${{ needs.setup.outputs.base-tag }}"

      # ── Test 4: reverse engineering resistance ─────────────────────────────

      - name: Download gdsdecomp
        run: |
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/bruvzg/gdsdecomp/releases/latest)

          echo "Available gdsdecomp release assets:"
          echo "$RELEASE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data['assets']:
              print(' ', a['name'])
          "

          # Try zip first, then tar.gz as fallback (naming conventions vary by release).
          # gdsdecomp does not include the arch in the filename (e.g. GDRE_tools-linux.zip),
          # so we only match on the OS token, not x86_64/amd64.
          ASSET_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          def is_linux(name):
              n = name.lower()
              return 'linux' in n or 'lin' in n
          # prefer zip; fall back to tar.gz / tar.xz
          for ext in ('.zip', '.tar.gz', '.tar.xz'):
              for a in assets:
                  if is_linux(a['name']) and a['name'].lower().endswith(ext):
                      print(a['browser_download_url'])
                      sys.exit(0)
          ")

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: no Linux archive found in the latest gdsdecomp release."
            echo "Check https://github.com/bruvzg/gdsdecomp/releases/latest for available assets."
            exit 1
          fi
          echo "Downloading gdsdecomp from: $ASSET_URL"

          case "$ASSET_URL" in
            *.tar.gz)  curl -fL --retry 5 --retry-delay 10 "$ASSET_URL" -o gdsdecomp.tar.gz
                       mkdir -p gdsdecomp && tar -xzf gdsdecomp.tar.gz -C gdsdecomp/ ;;
            *.tar.xz)  curl -fL --retry 5 --retry-delay 10 "$ASSET_URL" -o gdsdecomp.tar.xz
                       mkdir -p gdsdecomp && tar -xJf gdsdecomp.tar.xz -C gdsdecomp/ ;;
            *)         curl -fL --retry 5 --retry-delay 10 "$ASSET_URL" -o gdsdecomp.zip
                       unzip -q gdsdecomp.zip -d gdsdecomp/ ;;
          esac

          find gdsdecomp/ -type f | xargs chmod +x 2>/dev/null || true
          echo "gdsdecomp contents:"
          find gdsdecomp/ -type f

      - name: Reverse engineering resistance test
        run: |
          python3 test/scripts/test_reverse_engineering.py \
            --pck    test/project/exported/test.pck \
            --tool   gdsdecomp/ \
            --secret "${{ env.TEST_SECRET }}"

  # ── Package: merge per-OS bundles into one artifact per cipher ────────────────
  # Only runs when integration tests pass.

  package:
    name: Package (${{ matrix.cipher }})
    needs: [build, integration-test]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cipher: [aes, camellia, aria]

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v6
        with:
          name: godot-secure-${{ matrix.cipher }}-Linux
          path: release/linux/

      - name: Download macOS binaries
        uses: actions/download-artifact@v6
        with:
          name: godot-secure-${{ matrix.cipher }}-macOS
          path: release/macos/

      - name: Download Windows binaries
        uses: actions/download-artifact@v6
        with:
          name: godot-secure-${{ matrix.cipher }}-Windows
          path: release/windows/

      - name: Upload release package
        uses: actions/upload-artifact@v6
        with:
          name: godot-secure-${{ matrix.cipher }}
          path: release/
          if-no-files-found: error
