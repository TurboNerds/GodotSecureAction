name: GodotSecureAction

description: >
  GitHub Action that downloads the Godot Engine source, optionally downloads
  and applies Godot Secure, then compiles the editor and/or export templates.
  The Godot source download is cached by version so repeat runs skip the fetch.

inputs:

  # ── Godot source ────────────────────────────────────────────────────────────

  godot-version:
    description: >
      Godot version tag or branch to download (e.g. 4.6-stable, master).
      When set the action downloads the source automatically and places it at
      godot-source. Leave empty if the source is already present in the
      workspace.
    default: '4.6-stable'

  godot-repo:
    description: >
      GitHub repository to download Godot source from.
    default: 'godotengine/godot'

  godot-source:
    description: >
      Path where the Godot C++ source root is (or will be downloaded to),
      relative to the workspace. When godot-version is set, the source is
      downloaded into this directory. When godot-version is empty the source
      must already exist here.
    default: 'godot-source'

  cache-godot-source:
    description: >
      Cache the downloaded Godot source between runs, keyed by godot-repo and
      godot-version. Has no effect when godot-version is empty.
    default: 'true'

  # ── Godot Secure script ──────────────────────────────────────────────────────

  godot-secure-repo:
    description: >
      GitHub repository to download the Godot Secure release artifact from.
      Leave empty to skip downloading the script — use this when you have
      already checked it out separately or do not need it.
    default: 'emabrey/Godot-Secure'

  godot-secure-tag:
    description: >
      Release tag to download the Godot Secure artifact from.
      Example: v1.0.2-alpha, v1.2.0.
    default: 'v1.0.2-alpha'


  # ── Build ────────────────────────────────────────────────────────────────────

  target:
    description: >
      Build target(s) to compile.
      Accepted values: editor, template_debug, template_release, all.
      'all' compiles editor + template_debug + template_release.
    default: 'editor'

  platform:
    description: >
      Target platform. When left empty the platform is auto-detected from the
      runner OS (linux, macos, windows). Set explicitly to cross-compile.
    default: ''

  arch:
    description: >
      Target architecture. When left empty the architecture is auto-detected.
      Common values: x86_64, arm64, universal (macOS fat binary).
    default: ''

  precision:
    description: >
      Floating-point precision to build with.
      Accepted values: single, double.
    default: 'single'

  use-lto:
    description: Enable link-time optimisation for release template builds.
    default: 'false'

  extra-scons-args:
    description: >
      Additional SCons arguments appended verbatim to every scons invocation.
      Example: "use_llvm=yes use_mingw=no"
    default: ''

  scons-cache:
    description: Cache the SCons build cache to speed up incremental builds.
    default: 'false'

  scons-cache-path:
    description: Path used for the SCons build cache directory.
    default: '.scons-cache'

  python-version:
    description: >
      Python version to set up for running SCons.
    default: '3.x'

outputs:

  godot-source-path:
    description: >
      Absolute path to the Godot source tree used for the build.
    value: ${{ steps.resolve-source.outputs.source-path }}

  godot-secure-script:
    description: >
      Absolute path to the downloaded godot_secure.py. Empty when
      godot-secure-repo was not set.
    value: ${{ steps.fetch-godot-secure.outputs.script-path }}

  editor-path:
    description: Absolute path to the compiled editor binary (if built).
    value: ${{ steps.locate-bins.outputs.editor-path }}

  template-debug-path:
    description: Absolute path to the compiled debug export template (if built).
    value: ${{ steps.locate-bins.outputs.template-debug-path }}

  template-release-path:
    description: Absolute path to the compiled release export template (if built).
    value: ${{ steps.locate-bins.outputs.template-release-path }}

author: Godot Secure
branding:
  icon: 'cpu'
  color: 'blue'

runs:
  using: 'composite'
  steps:

    # ── Python + SCons ─────────────────────────────────────────────────────────

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SCons
      shell: bash
      run: pip install scons

    # ── Godot source cache ─────────────────────────────────────────────────────

    - name: Cache Godot source
      if: inputs.godot-version != '' && inputs.cache-godot-source == 'true'
      id: cache-godot-source
      uses: actions/cache@v5
      with:
        path: ${{ inputs.godot-source }}
        key: godot-source-${{ inputs.godot-repo }}-${{ inputs.godot-version }}

    # ── Download Godot source ──────────────────────────────────────────────────

    - name: Download Godot source
      if: >-
        inputs.godot-version != '' &&
        (inputs.cache-godot-source != 'true' ||
         steps.cache-godot-source.outputs.cache-hit != 'true')
      shell: bash
      run: |
        REF="${{ inputs.godot-version }}"
        REPO="${{ inputs.godot-repo }}"
        DEST="${{ inputs.godot-source }}"

        mkdir -p "$DEST"

        # GitHub serves release tags under /refs/tags/ and branches under
        # /refs/heads/. Try the tag URL first; fall back to a branch URL if
        # the server returns anything other than 200.
        TAG_URL="https://github.com/${REPO}/archive/refs/tags/${REF}.tar.gz"
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$TAG_URL")

        if [ "$STATUS" = "200" ]; then
          DOWNLOAD_URL="$TAG_URL"
          echo "Resolved '${REF}' as a release tag."
        else
          DOWNLOAD_URL="https://github.com/${REPO}/archive/refs/heads/${REF}.tar.gz"
          echo "Tag not found (HTTP ${STATUS}); resolving '${REF}' as a branch."
        fi

        echo "Downloading Godot source from ${DOWNLOAD_URL}"
        curl -fL "$DOWNLOAD_URL" \
          | tar -xz --strip-components=1 -C "$DEST"

        echo "Godot source downloaded to ${DEST}."

    # ── Resolve and expose the source path ────────────────────────────────────

    - name: Resolve Godot source path
      id: resolve-source
      shell: bash
      run: |
        SOURCE_PATH="$(pwd)/${{ inputs.godot-source }}"
        if [ ! -f "$SOURCE_PATH/SConstruct" ]; then
          echo "::error::Godot source not found at ${SOURCE_PATH}. " \
               "Set godot-version to download it automatically, or check " \
               "that godot-source points to an existing source tree."
          exit 1
        fi
        echo "source-path=$SOURCE_PATH" >> "$GITHUB_OUTPUT"
        echo "Godot source root: $SOURCE_PATH"

    # ── Download Godot Secure release artifact ─────────────────────────────────

    - name: Download Godot Secure script
      if: inputs.godot-secure-repo != ''
      id: fetch-godot-secure
      shell: bash
      run: |
        REPO="${{ inputs.godot-secure-repo }}"
        TAG="${{ inputs.godot-secure-tag }}"
        URL="https://github.com/${REPO}/releases/download/${TAG}/godot_secure.py"

        echo "Downloading godot_secure.py from ${URL}"
        curl -fL "$URL" -o godot_secure.py

        SCRIPT_ABS="$(pwd)/godot_secure.py"
        echo "script-path=$SCRIPT_ABS" >> "$GITHUB_OUTPUT"
        echo "Downloaded to ${SCRIPT_ABS}."

    # ── Linux system dependencies ──────────────────────────────────────────────

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential \
          libx11-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxi-dev \
          libxext-dev \
          libxrender-dev \
          libgl1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libudev-dev \
          libdbus-1-dev \
          libfreetype-dev \
          pkg-config \
          yasm

    # ── macOS dependencies ─────────────────────────────────────────────────────

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Xcode command-line tools are pre-installed on GitHub-hosted macOS runners.
        brew install yasm || true

    # ── SCons build cache ──────────────────────────────────────────────────────

    - name: Restore SCons cache
      if: inputs.scons-cache == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ inputs.scons-cache-path }}
        key: >-
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{
          inputs.platform }}-${{ inputs.arch }}-${{ inputs.precision }}-${{
          inputs.target }}-${{ runner.os }}-${{
          hashFiles(format('{0}/version.py', inputs.godot-source)) }}
        restore-keys: |
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.precision }}-${{ inputs.target }}-${{ runner.os }}-
          scons-${{ inputs.godot-repo }}-${{ inputs.godot-version }}-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.precision }}-${{ runner.os }}-

    # ── Resolve build parameters ───────────────────────────────────────────────

    - name: Resolve platform, arch, and targets
      id: params
      shell: bash
      run: |
        # ── Platform ──────────────────────────────────────────────────────────
        PLATFORM="${{ inputs.platform }}"
        if [ -z "$PLATFORM" ]; then
          case "${{ runner.os }}" in
            Linux)   PLATFORM="linuxbsd" ;;
            macOS)   PLATFORM="macos"    ;;
            Windows) PLATFORM="windows"  ;;
            *)
              echo "::error::Unsupported runner OS: ${{ runner.os }}"
              exit 1
              ;;
          esac
        fi
        echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

        # ── Architecture ──────────────────────────────────────────────────────
        ARCH="${{ inputs.arch }}"
        if [ -z "$ARCH" ]; then
          case "${{ runner.os }}" in
            Linux)   ARCH="x86_64"   ;;
            macOS)   ARCH="universal" ;;
            Windows) ARCH="x86_64"   ;;
          esac
        fi
        echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

        # ── Targets ───────────────────────────────────────────────────────────
        RAW_TARGET="${{ inputs.target }}"
        if [ "$RAW_TARGET" = "all" ]; then
          echo "targets=editor template_debug template_release" >> "$GITHUB_OUTPUT"
        else
          echo "targets=$RAW_TARGET" >> "$GITHUB_OUTPUT"
        fi

        # ── SCons cache arg ───────────────────────────────────────────────────
        if [ "${{ inputs.scons-cache }}" = "true" ]; then
          echo "cache-arg=cache_path=${{ inputs.scons-cache-path }}" >> "$GITHUB_OUTPUT"
        else
          echo "cache-arg=" >> "$GITHUB_OUTPUT"
        fi

    # ── Build ──────────────────────────────────────────────────────────────────

    - name: Build Godot
      shell: bash
      working-directory: ${{ inputs.godot-source }}
      run: |
        PLATFORM="${{ steps.params.outputs.platform }}"
        ARCH="${{ steps.params.outputs.arch }}"
        PRECISION="${{ inputs.precision }}"
        LTO="${{ inputs.use-lto }}"
        EXTRA="${{ inputs.extra-scons-args }}"
        CACHE_ARG="${{ steps.params.outputs.cache-arg }}"

        ARCH_ARG=""
        [ -n "$ARCH" ] && ARCH_ARG="arch=$ARCH"

        LTO_ARG="lto=none"
        [ "$LTO" = "true" ] && LTO_ARG="lto=thin"

        for TARGET in ${{ steps.params.outputs.targets }}; do
          echo "::group::SCons — platform=$PLATFORM target=$TARGET"
          scons \
            platform="$PLATFORM" \
            target="$TARGET" \
            precision="$PRECISION" \
            $ARCH_ARG \
            $LTO_ARG \
            $CACHE_ARG \
            $EXTRA \
            -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
          echo "::endgroup::"
        done

    # ── Locate compiled binaries and set outputs ───────────────────────────────

    - name: Locate compiled binaries
      id: locate-bins
      shell: bash
      working-directory: ${{ inputs.godot-source }}
      run: |
        PLATFORM="${{ steps.params.outputs.platform }}"
        SOURCE_ABS="$(pwd)"

        locate_bin() {
          local target="$1"
          local result=""
          case "$PLATFORM" in
            macos)
              result=$(find bin -type f -name "Godot*" -path "*/MacOS/Godot" 2>/dev/null \
                | grep -i "$target" | head -n 1)
              [ -z "$result" ] && result=$(find bin -type f -name "*.macos.*" 2>/dev/null \
                | grep -i "$target" | head -n 1)
              ;;
            windows)
              result=$(find bin -type f -name "*.exe" 2>/dev/null \
                | grep -v "console" | grep -i "$target" | head -n 1)
              ;;
            *)
              result=$(find bin -type f -executable 2>/dev/null \
                | grep -i "$target" | head -n 1)
              ;;
          esac
          [ -n "$result" ] && echo "$SOURCE_ABS/$result"
        }

        EDITOR_PATH=""
        DEBUG_PATH=""
        RELEASE_PATH=""

        for TARGET in ${{ steps.params.outputs.targets }}; do
          case "$TARGET" in
            editor)           EDITOR_PATH=$(locate_bin "editor")          ;;
            template_debug)   DEBUG_PATH=$(locate_bin "template_debug")   ;;
            template_release) RELEASE_PATH=$(locate_bin "template_release") ;;
          esac
        done

        echo "editor-path=$EDITOR_PATH"            >> "$GITHUB_OUTPUT"
        echo "template-debug-path=$DEBUG_PATH"     >> "$GITHUB_OUTPUT"
        echo "template-release-path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"

        echo "── Compiled binaries ────────────────────────────────────────"
        [ -n "$EDITOR_PATH"  ] && echo "  editor          : $EDITOR_PATH"
        [ -n "$DEBUG_PATH"   ] && echo "  template_debug  : $DEBUG_PATH"
        [ -n "$RELEASE_PATH" ] && echo "  template_release: $RELEASE_PATH"
        echo "─────────────────────────────────────────────────────────────"
